[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
version = "0.1.0"
description = "Local evocative video studio — research, script, illustrate, narrate, assemble"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "ddgs>=9.0.0",
  "trafilatura>=1.12.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "pillow>=10.4.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "aiofiles>=24.1.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
tts = ["kokoro>=0.9.2", "torch"]
dev = ["ruff>=0.6.0"]

[project.scripts]
videogen = "videogen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videogen = ["py.typed"]
